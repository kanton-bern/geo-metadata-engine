{% extends "admin/base_site.html" %}
{% block footer %}
{{ block.super }}
<div style="text-align: center; font-size: 0.8em; color: #999; padding: 8px 0">
  <a href="https://github.com/kanton-bern/geo-metadata-engine/blob/main/THIRD-PARTY-LICENSES.md" target="_blank" rel="noopener" style="color: #999">Third-Party Licenses</a>
  {% if user.is_authenticated %}
  <span style="margin: 0 8px">·</span>
  <span class="build-info" style="cursor: pointer" title="Click to copy">
    <span class="build-info-label">Build info</span>
    <span class="build-info-details">{{ app_version }} · {{ pod_name }}</span>
    <span class="build-info-copied">Copied!</span>
  </span>
  <style>
    .build-info-details,
    .build-info-copied { display: none; user-select: all; }
    .build-info:hover .build-info-label { display: none; }
    .build-info:hover .build-info-details { display: inline; }
    .build-info.copied .build-info-details { display: none; }
    .build-info.copied .build-info-copied { display: inline; }
  </style>
  <script>
    // Copy the build info to the clipboard on click and show a short confirmation.
    document.querySelector(".build-info").addEventListener("click", function () {
      const el = this;
      const text = el.querySelector(".build-info-details").textContent;
      navigator.clipboard.writeText(text).then(function () {
        el.classList.add("copied");
        setTimeout(function () { el.classList.remove("copied"); }, 1500);
      });
    });
  </script>
  {% endif %}
</div>
{% endblock %}
