# see: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/labels/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true # mimics old 'commonLabels' behaviour
    includeTemplates: false
    pairs:
      customer.gitops.bedag.ch/hlq: act
      customer.gitops.bedag.ch/stage: ${stage}
resources:
  - ../base
  - geo-metadata-engine