apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geo-metadata-engine
  labels:
    prometheus.alerting.bedag.ch: "false"
spec:
  interval: 5m
  chart:
    spec:
      chart: common
      version: "12.7.0"
      sourceRef:
        kind: HelmRepository
        name: bedag-public
        namespace: flux-public
  releaseName: geo-metadata-engine-${stage}
  install:
    remediation:
      # dont retry install
      retries: 0
      # do not cleanup if helm install fails
      remediateLastFailure: false
  upgrade:
    remediation:
      # dont retry installs
      retries: 0
      # do not cleanup if helm install fails
      remediateLastFailure: false
  valuesFrom:
    - kind: ConfigMap
      name: geo-metadata-engine-values
      optional: true
    - kind: ConfigMap
      name: geo-metadata-engine-stage-values
      optional: true
    - kind: Secret
      name: geo-metadata-engine-stage-secrets
      optional: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: geo-metadata-engine-geo-metadata-engine
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders
                value:
                  - name: Host
                    value: geo-metadata-engine-dev.apps.be.ch
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders
                value:
                  - name: Host
                    value: geo-metadata-engine-dev.apps.be.ch