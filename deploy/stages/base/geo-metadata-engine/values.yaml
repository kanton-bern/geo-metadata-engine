nameOverride: geo-metadata-engine

includes:
  ingress: true
  service: true
  deployment: true
  statefulset: false
  envSecret: true
  envConfigMap: false
  files: false
  configFiles: false
  binaryFiles: false
  pvcs: true
  job: false
  cronjob: false
  servicemonitor: false
  networkpolicy: false

secrets:
  data:
    registry:
      pullSecret:
        enabled: true
        name: harbor-registry-secret

ingresses:
  ingress:
    deploy: true
    ingressClassName: "kb-sh"
    tls:
      type: "existing"
      existing:
        secret: geo-metadata-engine-tls

components:
  geo-metadata-engine:
    services:
      http:
        deploy: true
        port: 8080
        targetPort: 8080
    controller:
      deploy: true
      replicas: 1
      type: Deployment
      extraLabels:
        "customer.gitops.bedag.ch/hlq": "a99"
        "customer.gitops.bedag.ch/stage": "${stage}"
      containers:
        geo-metadata-engine:
          image:
            repository: artifacts.bedag.cloud/apc/simple-status
            tag: v0.0.7
          containerPorts:
            - name: http
              containerPort: 8080
          env:
            - name: DEBUG
              value: False
            - name: ALLOWED_HOSTS
              value: 127.0.0.1,localhost
            - name: CSRF_TRUSTED_ORIGINS
              value: ""
          containerSecurityContext:
            enabled: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
