ingresses:
  ingress:
    rules:
      - host: status.as6-geo-metadata-${stage}-apps.k8s.infra.be.ch
        http:
          paths:
            - backend:
                serviceNameSuffix: simplestatus-http
                servicePort: 8080
              path: "/"
        secretName: "simple-status-tls"
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-bedag
      cert-manager.io/common-name: status.as6-geo-metadata-${stage}-apps.k8s.infra.be.ch