apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geo-metadata-engine
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: geo-metadata-engine-geo-metadata-engine
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe/httpGet
                value:
                  path: /healthz
                  port: http
                  httpHeaders:
                    - name: Host
                      value: geo-metadata-engine-dev.apps.be.ch
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/httpGet
                value:
                  path: /healthz
                  port: http
                  httpHeaders:
                    - name: Host
                      value: geo-metadata-engine-dev.apps.be.ch