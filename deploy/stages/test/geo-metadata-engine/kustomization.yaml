apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: act-geo-metadaten-${stage}-apps
resources:
  - ../../base/geo-metadata-engine/
  - secrets/
configMapGenerator:
- name: geo-metadata-engine-stage-values
  files:
  - values.yaml
  options:
    disableNameSuffixHash: true
patches:
  - target:
      version: v1
      kind: Deployment
      name: geo-metadata-engine-geo-metadata-engine
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders
        value:
          - name: Host
            value: geo-metadata-engine-dev.apps.be.ch
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders
        value:
          - name: Host
            value: geo-metadata-engine-dev.apps.be.ch