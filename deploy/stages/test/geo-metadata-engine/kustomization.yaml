apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: act-geo-metadaten-${stage}-apps
resources:
  - ../../base/geo-metadata-engine/
  - secrets/
configMapGenerator:
- name: geo-metadata-engine-stage-values
  files:
  - values.yaml
  options:
    disableNameSuffixHash: true
patches:
  - path: patches/helmrelease.yaml