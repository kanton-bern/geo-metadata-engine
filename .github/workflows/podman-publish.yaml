name: Build and Push Podman Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch: develop → Testumgebung, main → Produktion'
        required: true
        type: choice
        options:
          - develop
          - main
        default: develop

env:
  REGISTRY: ghcr.io
  # Der Image-Name wird komplett in Kleinbuchstaben in der GHCR erwartet
  IMAGE_NAME: ${{ github.repository }}
  # Branch, auf dem Flux die Prod-Values liest (= Basis für den Bump-PR).
  # Sobald Flux für die Prod-Stage auf main zeigt: hier auf "main" ändern.
  PROD_VALUES_BRANCH: develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      # Baut den per Input gewählten Branch (develop oder main)
      - name: Checkout repository (build branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract short Git SHA
        id: sha
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Tag-Präfix = gewählter Branch, z. B. main-20260707120000-abc1234
      - name: Create Tag
        id: meta
        run: |
          echo "tag=${{ inputs.branch }}-$(date +'%Y%m%d%H%M%S')-${{ steps.sha.outputs.sha_short }}" >> $GITHUB_OUTPUT

      - name: Build Image with Podman
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      - name: Push Image to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      # develop → Test-Tag direkt auf develop pushen (Flux deployt in die Testumgebung)
      - name: Update test image tag on develop
        if: inputs.branch == 'develop'
        env:
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          yq -i '.components.geo-metadata-engine.controller.containers.geo-metadata-engine.image.tag = strenv(NEW_TAG)' \
            deploy/stages/test/geo-metadata-engine/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/stages/test/geo-metadata-engine/values.yaml
          git commit -m "chore: bump test image to ${NEW_TAG}"
          git pull --rebase origin develop
          git push origin HEAD:develop

      # main → Prod-Bump als PR gegen PROD_VALUES_BRANCH.
      # Der PR-Merge ist die bewusste Freigabe für den Prod-Deploy.
      - name: Checkout prod values branch
        if: inputs.branch == 'main'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PROD_VALUES_BRANCH }}

      - name: Create pull request with prod image bump
        if: inputs.branch == 'main'
        env:
          NEW_TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP_BRANCH="chore/bump-prod-image-${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BUMP_BRANCH}"
          yq -i '.components.geo-metadata-engine.controller.containers.geo-metadata-engine.image.tag = strenv(NEW_TAG)' \
            deploy/stages/prod/geo-metadata-engine/values.yaml
          git add deploy/stages/prod/geo-metadata-engine/values.yaml
          git commit -m "chore: bump prod image to ${NEW_TAG}"
          git push origin "${BUMP_BRANCH}"
          gh pr create \
            --base "${PROD_VALUES_BRANCH}" \
            --head "${BUMP_BRANCH}" \
            --title "chore: bump prod image to ${NEW_TAG}" \
            --body "Automated production image bump to \`${NEW_TAG}\` (built from \`main\`). Merging this PR deploys the image to production via Flux."
