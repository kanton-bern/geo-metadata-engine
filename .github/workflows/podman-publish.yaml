name: Build and Push Podman Image
run-name: "Build and Push Podman Image (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }} · ${{ (inputs.branch || github.ref_name) == 'main' && 'prod environment' || 'test environment' }})"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch: develop → test environment, main → production'
        required: true
        type: choice
        options:
          - develop
          - main
        default: develop
  push:
    branches:
      - develop
      - main
    paths-ignore:
      # The workflow's own values commits and merged prod bump PRs must not re-trigger a build
      - 'deploy/**'
      # Docs-only changes don't need an image
      - 'docs/**'
      - '**.md'

# Serialize builds per branch; a queued run always builds the branch tip anyway
concurrency:
  group: podman-publish-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires the image name to be all lowercase
  IMAGE_NAME: ${{ github.repository }}
  # Branch on which Flux reads the prod values (= base for the bump PR)
  PROD_VALUES_BRANCH: main
  # Branch to build: manual dispatch input, or the pushed branch on push events
  BUILD_BRANCH: ${{ inputs.branch || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # Build the selected branch (manual input) or the pushed branch (develop or main)
      - name: Checkout repository (build branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract short Git SHA
        id: sha
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Tag prefix = build branch, e.g. main-20260707120000-abc1234
      - name: Create Tag
        id: meta
        run: |
          echo "tag=${BUILD_BRANCH}-$(date +'%Y%m%d%H%M%S')-${{ steps.sha.outputs.sha_short }}" >> $GITHUB_OUTPUT

      - name: Build Image with Podman
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      - name: Push Image to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      # develop → push the test tag directly to develop (Flux deploys to the test environment)
      - name: Update test image tag on develop
        if: env.BUILD_BRANCH == 'develop'
        env:
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          yq -i '.components.geo-metadata-engine.controller.containers.geo-metadata-engine.image.tag = strenv(NEW_TAG)' \
            deploy/stages/test/geo-metadata-engine/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/stages/test/geo-metadata-engine/values.yaml
          git commit -m "chore: bump test image to ${NEW_TAG}"
          git pull --rebase origin develop
          git push origin HEAD:develop
          {
            echo "## Test deployment prepared"
            echo ""
            echo "Image \`${NEW_TAG}\` was built from \`develop\`, pushed to GHCR and written to the test values on \`develop\`."
            echo ""
            echo "Flux will deploy it to the test environment within ~5 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      # main → push the prod bump as a branch; the PR is opened manually
      # (GitHub Actions is not allowed to create PRs in this organization).
      # Merging the PR is the deliberate approval for the prod deployment.
      - name: Checkout prod values branch
        if: env.BUILD_BRANCH == 'main'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PROD_VALUES_BRANCH }}

      - name: Push branch with prod image bump
        if: env.BUILD_BRANCH == 'main'
        env:
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          BUMP_BRANCH="chore/bump-prod-image-${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BUMP_BRANCH}"
          yq -i '.components.geo-metadata-engine.controller.containers.geo-metadata-engine.image.tag = strenv(NEW_TAG)' \
            deploy/stages/prod/geo-metadata-engine/values.yaml
          git add deploy/stages/prod/geo-metadata-engine/values.yaml
          git commit -m "chore: bump prod image to ${NEW_TAG}"
          git push origin "${BUMP_BRANCH}"
          PR_URL="${{ github.server_url }}/${{ github.repository }}/compare/${PROD_VALUES_BRANCH}...${BUMP_BRANCH}?expand=1"
          echo "Create the production deployment PR here: ${PR_URL}"
          {
            echo "## Prod deployment prepared"
            echo ""
            echo "Image \`${NEW_TAG}\` was built from \`main\` and the bump branch \`${BUMP_BRANCH}\` was pushed."
            echo ""
            echo "**[→ Create pull request](${PR_URL})** — merging it deploys the image to production via Flux."
          } >> "$GITHUB_STEP_SUMMARY"
