name: Cleanup Container Image Versions
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only show what would be deleted, delete nothing"
        type: boolean
        default: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: "kanton-bern/geo-metadata-engine"
          package-type: "container"
          min-versions-to-keep: 2
          dry-run: ${{ inputs.dry_run }}